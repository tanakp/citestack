# Run inside the private Compose network. Never publish Prometheus without its own
# authentication. Mount a client key read-only at /run/secrets/metrics-key.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: citestack
    static_configs:
      - targets: [api:8000]
    http_headers:
      X-API-Key:
        files: [/run/secrets/metrics-key]
