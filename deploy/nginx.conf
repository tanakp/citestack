worker_processes auto;
pid /tmp/nginx.pid;
# Nginx request errors can include raw URLs even with access_log off. Availability
# is monitored through API metrics/readiness and container state instead.
error_log /dev/null;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    keepalive_timeout 15s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/tls/cert.pem;
        ssl_certificate_key /run/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        limit_conn connections 16;
        location = /metrics { return 404; }
        location / {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 125s;
            proxy_send_timeout 10s;
        }
    }
}
