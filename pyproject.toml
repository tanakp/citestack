[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citestack"
version = "0.1.0"
description = "Inspectable retrieval and cited answers over public documentation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "pydantic-settings>=2.6,<3",
  "sentence-transformers>=5,<6",
  "torch>=2.6,<3",
  "filelock>=3.16,<4",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
citestack = "citestack.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: downloads and runs actual neural models"]

# Avoid downloading CUDA runtimes for the CPU-only Linux/Docker deployment.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
