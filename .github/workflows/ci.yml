name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv run pytest -q -m 'not integration'
      - run: uv run python examples/structured_demo.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t citestack:ci .
      - name: Exercise production API in a restricted container
        run: |
          docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$PWD/tests/container_smoke.py:/smoke.py:ro" \
            --entrypoint python citestack:ci /smoke.py

      - name: Exercise production TLS, restart, and container isolation
        run: PYTHONPATH=src python tests/deployment_smoke.py --check-ollama
      - name: Verify default development Compose configuration
        run: |
          docker compose config --format json > /tmp/development-compose.json
          python -c "import json; c=json.load(open('/tmp/development-compose.json')); assert c['services']['api']['environment'].get('CITESTACK_API_KEY') is None"
