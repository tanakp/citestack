name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv run pytest -q -m 'not integration'
      - run: uv run python examples/structured_demo.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t citestack:ci .
      - run: docker run --rm citestack:ci --help
