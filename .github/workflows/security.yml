name: Security and operations
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Audit the installed locked Linux dependencies
        run: |
          uv run python tests/audit_dependencies.py
          uv tool run pip-audit==2.10.1 --no-deps --disable-pip -r data/audit-requirements.txt \
            --format json --output data/dependency-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          dependencies = json.loads(Path('data/dependency-audit.json').read_text())['dependencies']
          expected = len(Path('data/audit-requirements.txt').read_text().splitlines())
          assert len(dependencies) == expected, 'Incomplete dependency audit'
          assert not any(item.get('skip_reason') for item in dependencies), 'Unaudited dependency'
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-audit-${{ github.sha }}
          path: |
            data/dependency-audit.json
            data/audit-requirements.txt
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan all fetched Git history without exposing matched credentials
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks
          /tmp/gitleaks/gitleaks git --redact --log-opts=--all
  alert-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify alert firing, hold times, recovery, and low-traffic suppression
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz -o /tmp/prometheus.tar.gz
          echo 'f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d  /tmp/prometheus.tar.gz' | sha256sum --check
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          /tmp/prometheus-3.14.0.linux-amd64/promtool test rules deploy/alerts.test.yml
          /tmp/prometheus-3.14.0.linux-amd64/promtool check config --syntax-only deploy/prometheus.example.yml
